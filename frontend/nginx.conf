server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The console is hash-routed, so any path serves the same document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin for the API keeps the bearer token out of CORS and out of the URL (§14.2).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The execution journal is an SSE stream: buffering off, and a read window longer than a run.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
