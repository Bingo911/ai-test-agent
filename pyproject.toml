[project]
name = "ai-test-agent"
version = "0.1.0"
description = "Markdown-driven, AI-assisted browser test automation platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.11,<1.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
