name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the project and its dev extras
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check backend tests scripts
          ruff format --check backend tests scripts
      # The suite drives a real Chromium through the executor, so the browser is part of the build.
      - name: Install the pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Build web app
        working-directory: frontend
        run: npm run build
