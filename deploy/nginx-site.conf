# §13.3: the HTTPS proxy in front of the API, for the official client address
# `https://test.example.com/mcp`. Copy it, change the addresses and the certificate paths, and keep the
# path list closed: this file decides what the public entry forwards, so an extra `location` is an extra
# exposed route.
#
# The API itself never rebuilds a URL from Host or from a forwarding header — the resource metadata, the
# console links and the audience all come from MCP_PUBLIC_URL / MCP_CONSOLE_URL / MCP_OIDC_AUDIENCE. What
# this proxy has to do is not invent anything either: it forwards the path unchanged and the client's own
# Host, and it does not add an X-Forwarded-Host the API would not read anyway.

upstream aita_api {
    server api:8000;
    keepalive 32;
}

# Port 80 answers nothing but the move to TLS: a request that arrives over http is redirected, never
# served, so an `http://` resource URL can never be the one a client ends up with.
server {
    listen 80;
    server_name test.example.com;
    return 301 https://test.example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name test.example.com;

    ssl_certificate     /etc/tls/live/fullchain.pem;
    ssl_certificate_key /etc/tls/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # A REST request larger than this is refused here rather than half-read by the application. It is the
    # same number the process enforces (`MAX_REQUEST_BODY_BYTES`, 32 MiB); the proxy says 413 first and
    # the API would too. `/mcp` narrows it further below.
    client_max_body_size 32m;

    # Log without the request line's query string and without any header value: an MCP request carries a
    # bearer token in `Authorization`, and the access log is the place a copy of it must not end up.
    log_format aita_access '$remote_addr - [$time_iso8601] "$method $path" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/aita.access.log aita_access;
    error_log  /var/log/nginx/aita.error.log warn;

    proxy_http_version 1.1;
    # The legitimate Host is forwarded, so the API's own allowlist (MCP_ALLOWED_HOSTS) still sees the
    # address the client used. TLS termination means the API hears plain HTTP on the private network.
    proxy_set_header Host                $host;
    proxy_set_header X-Forwarded-Proto   https;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;

    # The MCP endpoint: streamable HTTP, so nothing may buffer the response and a long idle tool call must
    # not be cut off at the proxy. `Authorization`, `MCP-Protocol-Version`, `Mcp-Method`, `Mcp-Name`,
    # `Accept` and `Content-Type` reach the API by nginx's normal pass-through — they are deliberately not
    # re-set here, because `proxy_set_header X ""` would send an empty header to a client that sent none.
    location = /mcp {
        client_max_body_size 1m;
        proxy_pass http://aita_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # RFC 9728 discovery, both spellings, plus any other well-known document this host publishes.
    location /.well-known/ {
        proxy_pass http://aita_api;
        proxy_read_timeout 30s;
    }

    # The REST routes the console needs. The readiness probe sits under here as well, but it is written for
    # whoever balances the private side, not for public traffic.
    location /api/v1/ {
        proxy_pass http://aita_api;
        proxy_read_timeout 60s;
    }

    # Everything else is the console SPA. It is a separate origin from the MCP address, and the API's CORS
    # list (WEB_ORIGIN / MCP_ALLOWED_ORIGINS) is what decides whether a browser may call it — an absent
    # Origin from a desktop client is not the same case and is not handled here.
    location / {
        proxy_pass http://web:5173;
        proxy_read_timeout 60s;
    }
}
